<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>AI E-Posta Asistanı</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <script src="taskpane.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background-color: #f4f6f9; color: #333; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #0078d4; }
        .label { font-size: 12px; color: #666; }
        .value { font-size: 18px; font-weight: bold; margin-top: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">AI Sınıflandırma Sonucu</div>
        <div class="label">Kategori:</div>
        <div id="category" class="value">Analiz ediliyor...</div>
        <div class="label">Güven Skoru:</div>
        <div id="confidence" class="value">-</div>
    </div>
</body>
</html>
